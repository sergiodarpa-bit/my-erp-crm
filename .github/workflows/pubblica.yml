name: Costruisci e pubblica

# A ogni modifica del ramo main: costruisce l'immagine Docker e la pubblica su
# ghcr.io. Se il server è configurato (variabile DEPLOY_HOST), la installa sul server.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pubblica
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  immagine:
    name: Immagine Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:20.0
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  server:
    name: Pubblicazione sul server
    needs: immagine
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: produzione
      url: https://${{ vars.DEPLOY_DOMAIN || 'erp.kliniksanktmoritz.ch' }}
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER: ${{ vars.DEPLOY_USER || 'root' }}
      DIR: /opt/my-erp-crm
    steps:
      - uses: actions/checkout@v4
      - name: Chiave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copia i file di produzione
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "mkdir -p $DIR"
          scp -i ~/.ssh/id_deploy deploy/produzione/docker-compose.yml deploy/produzione/Caddyfile \
            deploy/produzione/my-erp-crm.conf.template deploy/produzione/.env.example \
            deploy/produzione/aggiorna.sh deploy/produzione/costruisci.sh deploy/configura_azienda.py "$USER@$HOST:$DIR/"
      - name: Installa la nuova versione
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" bash -s <<EOF
          set -euo pipefail
          cd "$DIR"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="${{ env.IMAGE }}:${{ github.sha }}" ./aggiorna.sh
          docker logout ghcr.io
          EOF
