[options]
addons_path = /opt/my-erp-crm/addons
data_dir = /var/lib/my-erp-crm
; Un solo database, sempre lo stesso: nessun elenco di database alla pagina di accesso.
db_name = my-erp-crm
dbfilter = ^my-erp-crm$
list_db = False
proxy_mode = True
http_interface = 0.0.0.0
; Password principale per la gestione dei database: CAMBIALA prima di andare in produzione.
admin_passwd = cambia-questa-password-principale
